{{define "login.html"}}{{template "head" .}}<header class="brand"><span class="brand-mark">L</span><strong>LifeLog</strong></header><section class="panel"><a class="back" href="/profiles">← Profiles</a><h1>{{.SelectedProfile.Name}}</h1><p class="muted">Enter your PIN or password to continue.</p>{{if .Error}}<div class="notice error" role="alert">{{.Error}}</div>{{end}}<form method="post" action="/login" class="stack"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><input type="hidden" name="profile_id" value="{{.SelectedProfile.ID}}"><label>PIN or password<input type="password" name="pin" autocomplete="current-password" required autofocus></label><button class="primary" type="submit">Continue</button></form></section>{{template "foot" .}}{{end}}
