{{define "appearance.html"}}{{template "head" .}}
<header class="topbar"><a class="brand compact" href="/today"><span class="brand-mark">L</span><strong>LifeLog</strong></a><a class="text-link" href="/settings">Back to settings</a></header>
<div class="page-heading"><h1>Appearance</h1><p class="muted">Choose how LifeLog looks on this device.</p></div>
<section class="card appearance-card"><div><h2>Color mode</h2><p class="muted">Selection applies immediately.</p></div><div class="mode-options" role="group" aria-label="Color mode"><button type="button" class="mode-option" data-color-mode="system" aria-pressed="false"><strong>System</strong><span>Follow this device's appearance.</span></button><button type="button" class="mode-option" data-color-mode="light" aria-pressed="false"><strong>Light</strong><span>Always use light mode.</span></button><button type="button" class="mode-option" data-color-mode="dark" aria-pressed="false"><strong>Dark</strong><span>Always use dark mode.</span></button></div></section>
<section class="card appearance-card"><div><h2>Theme</h2><p class="muted">Choose a palette for LifeLog.</p></div><div class="theme-options" role="group" aria-label="Theme">
<button type="button" class="theme-option" data-theme-option="lifelog" aria-pressed="false"><span class="theme-swatches" aria-hidden="true"><i></i><i></i><i></i></span><strong>LifeLog</strong><span>Clean green default</span></button>
<button type="button" class="theme-option" data-theme-option="neon-pink" aria-pressed="false"><span class="theme-swatches" aria-hidden="true"><i></i><i></i><i></i></span><strong>Neon Pink</strong><span>Dark magenta cyber</span></button>
<button type="button" class="theme-option" data-theme-option="matrix" aria-pressed="false"><span class="theme-swatches" aria-hidden="true"><i></i><i></i><i></i></span><strong>Matrix</strong><span>Black and vivid green</span></button>
<button type="button" class="theme-option" data-theme-option="warm" aria-pressed="false"><span class="theme-swatches" aria-hidden="true"><i></i><i></i><i></i></span><strong>Warm</strong><span>Cream and terracotta</span></button>
<button type="button" class="theme-option" data-theme-option="minimal" aria-pressed="false"><span class="theme-swatches" aria-hidden="true"><i></i><i></i><i></i></span><strong>Minimal</strong><span>Quiet monochrome</span></button>
<button type="button" class="theme-option" data-theme-option="midnight" aria-pressed="false"><span class="theme-swatches" aria-hidden="true"><i></i><i></i><i></i></span><strong>Midnight</strong><span>Deep navy and blue</span></button>
<button type="button" class="theme-option" data-theme-option="forest" aria-pressed="false"><span class="theme-swatches" aria-hidden="true"><i></i><i></i><i></i></span><strong>Forest</strong><span>Earthy green and moss</span></button>
<button type="button" class="theme-option" data-theme-option="lavender" aria-pressed="false"><span class="theme-swatches" aria-hidden="true"><i></i><i></i><i></i></span><strong>Lavender</strong><span>Muted violet calm</span></button>
</div><noscript><p class="muted">JavaScript is required to change appearance settings. LifeLog will follow your device.</p></noscript></section>
{{template "foot" .}}{{end}}
